<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %} Sistema Académico Oracle {% endblock %}</title>

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: Arial, Helvetica, sans-serif;
		}

		body {
			min-height: 100vh;
			background: linear-gradient(135deg, #e8f0ff, #f8fbff);
			color: #1f2937;
		}

		.main-wrapper {
			width: 100%;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
		}

		.navbar {
			width: 100%;
			background: #ffffff;
			box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
			padding: 18px 8%;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.logo {
			font-size: 22px;
			font-weight: bold;
			color: #2563eb;
			text-decoration: none;
		}

		.nav-actions {
			display: flex;
			gap: 12px;
			align-items: center;
		}

		.container {
			width: 100%;
			max-width: 1180px;
			margin: 0 auto;
			padding: 45px 20px;
			flex: 1;
		}

		.card {
			background: #ffffff;
			border-radius: 18px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
			padding: 35px;
		}

		.auth-card {
			width: 100%;
			max-width: 430px;
			margin: 40px auto;
		}

		.page-title {
			font-size: 32px;
			color: #111827;
			margin-bottom: 10px;
			text-align: center;
		}

		.page-subtitle {
			font-size: 15px;
			color: #6b7280;
			text-align: center;
			margin-bottom: 28px;
			line-height: 1.5;
		}

		.form-group {
			margin-bottom: 18px;
			text-align: left;
		}

		.form-group label {
			display: block;
			font-size: 14px;
			font-weight: bold;
			color: #374151;
			margin-bottom: 7px;
		}

		.form-control {
			width: 100%;
			padding: 13px 14px;
			border: 1px solid #d1d5db;
			border-radius: 10px;
			font-size: 15px;
			outline: none;
			transition: 0.2s ease-in-out;
			background: #f9fafb;
		}

		.form-control:focus {
			border-color: #2563eb;
			background: #ffffff;
			box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
		}

		.btn {
			display: inline-block;
			border: none;
			border-radius: 10px;
			padding: 12px 18px;
			font-size: 15px;
			font-weight: bold;
			text-decoration: none;
			cursor: pointer;
			transition: 0.2s ease-in-out;
			text-align: center;
		}

		.btn-primary {
			background: #2563eb;
			color: #ffffff;
		}

		.btn-primary:hover {
			background: #1d4ed8;
			transform: translateY(-1px);
		}

		.btn-secondary {
			background: #eef2ff;
			color: #2563eb;
		}

		.btn-secondary:hover {
			background: #dbeafe;
		}

		.btn-danger {
			background: #fee2e2;
			color: #dc2626;
		}

		.btn-danger:hover {
			background: #fecaca;
		}

		.btn-block {
			width: 100%;
			margin-top: 8px;
		}

		.auth-footer {
			text-align: center;
			margin-top: 22px;
			font-size: 14px;
			color: #6b7280;
		}

		.auth-footer a {
			color: #2563eb;
			font-weight: bold;
			text-decoration: none;
		}

		.auth-footer a:hover {
			text-decoration: underline;
		}

		.hero {
			display: grid;
			grid-template-columns: 1.2fr 0.8fr;
			gap: 25px;
			align-items: center;
			margin-bottom: 30px;
		}

		.hero-title {
			font-size: 38px;
			color: #111827;
			margin-bottom: 12px;
			line-height: 1.2;
		}

		.hero-text {
			color: #6b7280;
			font-size: 16px;
			line-height: 1.6;
			margin-bottom: 22px;
		}

		.hero-panel {
			background: linear-gradient(135deg, #2563eb, #1e40af);
			color: #ffffff;
			border-radius: 18px;
			padding: 30px;
			box-shadow: 0 10px 30px rgba(37, 99, 235, 0.25);
		}

		.hero-panel h3 {
			font-size: 24px;
			margin-bottom: 10px;
		}

		.hero-panel p {
			font-size: 15px;
			line-height: 1.5;
			opacity: 0.95;
		}

		.section-title {
			font-size: 24px;
			margin-bottom: 18px;
			color: #111827;
		}

		.section-block {
			margin-top: 28px;
		}

		.stats-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
			gap: 18px;
			margin-bottom: 28px;
		}

		.stat-card {
			background: #ffffff;
			border-radius: 16px;
			padding: 22px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
			border: 1px solid #eef2f7;
		}

		.stat-card span {
			display: block;
			font-size: 13px;
			color: #6b7280;
			margin-bottom: 8px;
		}

		.stat-card strong {
			font-size: 30px;
			color: #111827;
		}

		.user-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
			gap: 18px;
		}

		.user-card {
			background: #ffffff;
			border-radius: 16px;
			padding: 22px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
			border: 1px solid #eef2f7;
		}

		.user-avatar {
			width: 50px;
			height: 50px;
			border-radius: 50%;
			background: #dbeafe;
			color: #2563eb;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 20px;
			font-weight: bold;
			margin-bottom: 14px;
		}

		.user-card h4 {
			font-size: 18px;
			color: #111827;
			margin-bottom: 8px;
		}

		.user-card p {
			font-size: 14px;
			color: #6b7280;
			margin-bottom: 7px;
			line-height: 1.4;
		}

		.table-wrapper {
			background: #ffffff;
			border-radius: 16px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
			overflow-x: auto;
			border: 1px solid #eef2f7;
		}

		table {
			width: 100%;
			border-collapse: collapse;
		}

		th, td {
			padding: 13px 15px;
			text-align: left;
			border-bottom: 1px solid #eef2f7;
			font-size: 14px;
		}

		th {
			background: #f8fafc;
			color: #374151;
			font-weight: bold;
		}

		td {
			color: #4b5563;
		}

		.empty-state {
			text-align: center;
			padding: 35px;
			color: #6b7280;
			background: #ffffff;
			border-radius: 16px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
		}

		@media (max-width: 768px) {
			.navbar {
				flex-direction: column;
				gap: 15px;
				padding: 18px 20px;
			}

			.hero {
				grid-template-columns: 1fr;
			}

			.hero-title {
				font-size: 30px;
				text-align: center;
			}

			.hero-text {
				text-align: center;
			}

			.nav-actions {
				flex-wrap: wrap;
				justify-content: center;
			}

			.card {
				padding: 25px;
			}
		}
	</style>
</head>

<body>
	<div class="main-wrapper">
		<nav class="navbar">
			<a class="logo" href="{% url 'home' %}">Académico Oracle</a>

			<div class="nav-actions">
				<a class="btn btn-secondary" href="{% url 'home' %}">Inicio</a>

				{% if user.is_authenticated %}
					<a class="btn btn-danger" href="{% url 'user_logout' %}">Cerrar sesión</a>
				{% else %}
					<a class="btn btn-secondary" href="{% url 'user_login' %}">Iniciar sesión</a>
					<a class="btn btn-primary" href="{% url 'user_signup' %}">Registrarse</a>
				{% endif %}
			</div>
		</nav>

		<main class="container">
			{% block body %} {% endblock %}
		</main>
	</div>
</body>

</html>
