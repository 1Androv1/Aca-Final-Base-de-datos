{% extends 'base.html' %}
{% block title %} Actualizar perfil {% endblock %}

{% block body %}

<div class="card auth-card">
	<h2 class="page-title">Actualizar perfil</h2>
	<p class="page-subtitle">
		Modifica tus datos de usuario. La contrasena es opcional.
	</p>

	{% if error %}
		<p style="color: #b00020; font-weight: 600;">{{ error }}</p>
	{% endif %}

	<form method="post">
		{% csrf_token %}

		<div class="form-group">
			<label for="email">Correo electronico</label>
			<input class="form-control" type="email" id="email" name="email" value="{{ form_user.email }}" required>
		</div>

		<div class="form-group">
			<label for="name">Nombre completo</label>
			<input class="form-control" type="text" id="name" name="name" value="{{ form_user.name }}" required>
		</div>

		<div class="form-group">
			<label for="password">Nueva contrasena (opcional)</label>
			<input class="form-control" type="password" id="password" name="password" placeholder="Solo si quieres cambiarla">
		</div>

		<button class="btn btn-primary btn-block" type="submit">Guardar cambios</button>
	</form>
</div>

{% endblock %}
