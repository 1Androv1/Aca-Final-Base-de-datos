{% extends 'base.html' %}
{% block title %} Registro de usuario {% endblock %}

{% block body %}

<div class="card auth-card">
	<h2 class="page-title">Crear cuenta</h2>
	<p class="page-subtitle">
		Completa la información para registrarte en el sistema.
	</p>

	<form method="post">
		{% csrf_token %}

		<div class="form-group">
			<label for="email">Correo electrónico</label>
			<input class="form-control" type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
		</div>

		<div class="form-group">
			<label for="name">Nombre completo</label>
			<input class="form-control" type="text" id="name" name="name" placeholder="Ingresa tu nombre" required>
		</div>

		<div class="form-group">
			<label for="password">Contraseña</label>
			<input class="form-control" type="password" id="password" name="password" placeholder="Crea una contraseña segura" required>
		</div>

		<button class="btn btn-primary btn-block" type="submit">Crear cuenta</button>
	</form>

	<div class="auth-footer">
		¿Ya tienes una cuenta?
		<a href="{% url 'user_login' %}">Inicia sesión aquí</a>
	</div>
</div>

{% endblock %}
